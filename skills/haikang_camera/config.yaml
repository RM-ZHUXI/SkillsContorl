# haikang_camera 技能配置
#
# ⚠ 下面每一项都标了「生效 / 未生效」——只有标了「生效」的才会被代码读取：
#   读取代码：skills/haikang_camera/src/camera.cpp 的 camera::loadConfig()
#   未生效的项**保留**在这里是为了不丢信息（标定结果、调试素材规划），
#   当前版本用到它们的地方还没实现，改了它们不会有任何效果。

# ==================== 生效 ====================
# 相机型号。目前 camera.cpp 只实现了 MV-CS060-10UC-PRO 这一支：
# 型号对不上时 init 会直接失败（不会静默跑空）。
camera_name : "MV-CS060-10UC-PRO"

# 设备索引：同一个型号插了多台时用来选第几台（0 = 第一台）
camera_index : 0

# 曝光时间(us)。写失败只告警不阻断（部分机型/权限下不支持写）
camera_exposure : 30000.0

# 单帧取图超时(ms)：不要大于技能链的轮间隔（configs/skillsList.json 里的 interval），
# 否则相机掉线时每一轮都会阻塞这么久，停止链、轮次统计都会被拖住。默认 300。
grab_timeout_ms : 300

# ==================== 未生效（当前版本不读取） ====================
# 调试视频源：计划用于「没有相机时用一段视频当图像源」。
# 现状：⛔ 未实现 —— camera.cpp / main.cpp 都没有读这个键；
#       而且它指向的 resources/blue.avi 在本工程里并不存在（没有 resources 目录）。
# debug_video_path : "resources/blue.avi"

# 相机内参矩阵：3x3，fx, 0, cx / 0, fy, cy / 0, 0, 1（来自标定）
# 现状：⛔ 未实现 —— loadConfig() 不读它，也没有任何 cv::undistort 调用，
#       也就是说当前写进公共内存的图是**未经畸变校正**的原图。
#       要用的话需要：loadConfig 里解析 → cv::Mat 内参 → 在 camera::image() 出口做 undistort。
