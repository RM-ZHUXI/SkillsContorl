# camera_test 技能配置：把公共内存里的画面「开一个窗口显示出来」
# 说明：采集由别的技能负责（例如 haikang_camera 把画面写进 image）；
#       本技能只负责显示 —— 内存里是什么就显示什么，不改内存、不写文件、不做网页预览。

# 从公共内存的哪个键取图（要和你上游技能写入的键一致）
source_key   : "decision.debug"

# 是否开窗口（本技能就是干这个的，默认开）
#   - 需要图形环境：X11/DISPLAY（带桌面的 Ubuntu 虚拟机可以）；
#   - 没有 DISPLAY 时窗口建不起来，init 会失败并在日志/网页上给出原因；
#   - 窗口由本技能自己起的显示线程创建与刷新，不在技能链线程里开 GUI；
#   - 窗口里按 ESC 或 q 可以关掉窗口（技能本身继续跑）。
window       : true

# 窗口最大显示宽度(px)：画面更宽时等比缩小；0 = 不缩放（原尺寸显示）
window_width : 1080

# 窗口标题（标题里会带本次已显示帧数 #N）
window_name  : "camera_test · 图像显示"

# 图片保存位置(为了标定直接设置到标定文件夹)
image_save : "calibrate/camera"
